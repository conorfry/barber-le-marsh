<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Join the Queue — Barber le Marsh</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --bg:           #0a0a0a;
      --surface:      #141414;
      --border:       #242424;
      --text:         #f0f0f0;
      --muted:        #555;
      --green-bg:     #0d2e18;
      --green-border: #1a5c30;
      --green-text:   #d4f0e0;
      --amber-bg:     #2e1f00;
      --amber-border: #5c3e00;
      --amber-text:   #f5d98a;
      --red-bg:       #2e0d0d;
      --red-border:   #5c1a1a;
      --red-text:     #f5a0a0;
      --grey-bg:      #1a1a1a;
      --grey-border:  #333;
      --grey-text:    #888;
      --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .wrap { width: 100%; max-width: 380px; }

    .brand {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 48px;
    }

    /* ── State 1: Join form ── */
    .form-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .form-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
      padding: 14px 15px;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #444; }

    .btn-primary {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .error-msg {
      font-size: 13px;
      color: #ff6b6b;
      margin-top: 12px;
      display: none;
    }

    /* ── State 2: Status view ── */
    #state-status { display: none; }

    .banner {
      border-radius: 6px;
      padding: 18px 20px;
      margin-bottom: 20px;
      border-width: 1px;
      border-style: solid;
      transition: background 0.4s, border-color 0.4s;
    }

    .banner.green { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
    .banner.amber { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber-text); }
    .banner.red   { background: var(--red-bg);   border-color: var(--red-border);   color: var(--red-text); }
    .banner.grey  { background: var(--grey-bg);  border-color: var(--grey-border);  color: var(--grey-text); }

    .banner-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 5px;
    }

    .banner-msg {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Confirmation timer section */
    .confirm-section {
      display: none;
      margin-top: 14px;
    }

    .countdown {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 12px;
    }

    .btn-confirm {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Stat cards */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px 16px;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .stat-unit {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    .customer-tag {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
    }

    .queue-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 14px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .queue-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    .queue-status-dot.green { background: #3aaa70; }
    .queue-status-dot.amber { background: #d4952a; }
    .queue-status-dot.red   { background: #c94f4f; }

    .queue-status-text {
      font-size: 13px;
      color: var(--text);
    }

    .queue-status-text span {
      font-weight: 600;
    }

    .queue-status-text span.green { color: #3aaa70; }
    .queue-status-text span.amber { color: #d4952a; }
    .queue-status-text span.red   { color: #c94f4f; }
  </style>
</head>
<body>
<div class="wrap">

  <a href="/" style="display:inline-block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:32px;">← Home</a>

  <p class="brand">Barber le Marsh</p>

  <!-- State 1: Join form -->
  <div id="state-join">
    <h1 class="form-title">Join the Queue</h1>
    <p class="form-sub">Add your name and track your spot in real time.</p>

    <div class="queue-status" id="queue-status">
      <div class="queue-status-dot green" id="status-dot"></div>
      <p class="queue-status-text" id="status-text">Checking queue…</p>
    </div>

    <div class="field">
      <label for="inp-name">First Name</label>
      <input id="inp-name" type="text" placeholder="e.g. James" autocomplete="given-name">
    </div>
    <div class="field">
      <label for="inp-phone">Phone Number</label>
      <input id="inp-phone" type="tel" placeholder="e.g. 07700 900000" autocomplete="tel">
    </div>

    <button class="btn-primary" id="join-btn" onclick="joinQueue()">Join the List</button>
    <p class="error-msg" id="err-msg"></p>

    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);line-height:1.7">
      <p>Walk-in queue opens at <strong style="color:var(--text)">9:00 am</strong></p>
      <p>Doors open at <strong style="color:var(--text)">10:00 am</strong></p>
      <p>Open <strong style="color:var(--text)">Tuesday – Sunday</strong>, closed Monday</p>
      <p>Last walk-in accepted by <strong style="color:var(--text)">5:30 pm</strong></p>
    </div>
  </div>

  <!-- State 2: Live status -->
  <div id="state-status">
    <div class="banner green" id="banner">
      <p class="banner-label">Status</p>
      <p class="banner-msg" id="banner-msg">Loading…</p>

      <!-- Confirmation timer — shown only when status is active -->
      <div class="confirm-section" id="confirm-section">
        <p class="countdown" id="countdown-text"></p>
        <button class="btn-confirm" id="confirm-btn" onclick="confirmArrival()">I'm Here ✓</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <p class="stat-label">Position</p>
        <p class="stat-value" id="stat-pos">—</p>
        <p class="stat-unit">in line</p>
      </div>
      <div class="stat">
        <p class="stat-label">Est. Wait</p>
        <p class="stat-value" id="stat-wait">—</p>
        <p class="stat-unit" id="stat-wait-unit">min</p>
      </div>
    </div>

    <p class="customer-tag" id="customer-tag"></p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL      = 'https://isgtzoqtrirzxnyhsitv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzZ3R6b3F0cmlyenhueWhzaXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDQ3OTgsImV4cCI6MjA5NTgyMDc5OH0.G3hiIyI7AOaA1CUnIM-KybkYZJrsCXLkmooiEpGpmU4';

  // TODO: Replace with your n8n / Make / Zapier webhook URL
  const WEBHOOK_URL = 'https://your-webhook-endpoint.example.com/queue';

  const CONFIRM_SECONDS = 300; // 5 minutes to confirm arrival

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let myId        = null;
  let myOrder     = null;
  let countdownInterval = null;
  let webhookSent = {};

  // ── Webhook ───────────────────────────────────────────────────────────────────
  async function triggerWebhook(eventType, customer) {
    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventType, customer }),
      });
    } catch (e) { console.warn('Webhook error:', e); }
  }

  // ── Opening hours check ───────────────────────────────────────────────────────
  function isOpen() {
    const now = new Date();
    const day  = now.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
    const mins = now.getHours() * 60 + now.getMinutes();
    const openMins  = 10 * 60;
    const closeMins = 17 * 60 + 30; // 17:30 all open days
    const isOpenDay = day >= 2 && day <= 6 || day === 0; // Tue–Sun, closed Mon
    return isOpenDay && mins >= openMins && mins < closeMins;
  }

  // ── Live queue count indicator ────────────────────────────────────────────────
  function updateQueueStatus(count) {
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (!dot || !text) return;

    if (!isOpen()) {
      dot.className  = 'queue-status-dot red';
      dot.style.animation = 'none';
      text.innerHTML = '<span class="red">Closed</span> — queue not available right now';
      return;
    }

    dot.style.animation = '';
    let colour, label;
    if (count === 0) {
      colour = 'green'; label = '<span class="green">No wait</span> — walk right in';
    } else if (count <= 2) {
      colour = 'green'; label = `<span class="green">${count} waiting</span> — short wait`;
    } else if (count <= 5) {
      colour = 'amber'; label = `<span class="amber">${count} waiting</span> — moderate wait`;
    } else {
      colour = 'red'; label = `<span class="red">${count} waiting</span> — busy right now`;
    }

    dot.className  = `queue-status-dot ${colour}`;
    text.innerHTML = label;
  }

  async function fetchQueueCount() {
    const { count } = await db
      .from('daily_queue')
      .select('*', { count: 'exact', head: true })
      .in('status', ['waiting', 'active']);
    updateQueueStatus(count ?? 0);
  }

  fetchQueueCount();

  db.channel('queue-count')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_queue' }, fetchQueueCount)
    .subscribe();

  // ── Join queue ────────────────────────────────────────────────────────────────
  async function joinQueue() {
    const name  = document.getElementById('inp-name').value.trim();
    const phone = document.getElementById('inp-phone').value.trim();
    const err   = document.getElementById('err-msg');
    const btn   = document.getElementById('join-btn');

    if (!name || !phone) {
      showError('Please fill in both fields.');
      return;
    }

    // Block joins after 17:30 or on Mondays
    const now = new Date();
    const day = now.getDay();
    if (day === 1) {
      showError('Sorry, we\'re closed on Mondays. We open again Tuesday at 9:00 am.');
      return;
    }
    if (now.getHours() > 17 || (now.getHours() === 17 && now.getMinutes() >= 30)) {
      const nextOpen = day === 0 ? 'Tuesday' : 'tomorrow';
      showError(`Sorry, the queue is now closed for today. We open again ${nextOpen} at 9:00 am.`);
      return;
    }

    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking…';

    // Feature 1: block duplicate phone numbers in today's queue
    const todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);

    const { data: existing } = await db
      .from('daily_queue')
      .select('id')
      .eq('phone_number', phone)
      .in('status', ['waiting', 'active'])
      .gte('created_at', todayStart.toISOString())
      .limit(1);

    if (existing && existing.length > 0) {
      showError('This number is already in the queue today.');
      btn.disabled = false;
      btn.textContent = 'Join the List';
      return;
    }

    btn.textContent = 'Joining…';

    const { data, error } = await db
      .from('daily_queue')
      .insert({ customer_name: name, phone_number: phone, status: 'waiting' })
      .select()
      .single();

    if (error || !data) {
      showError('Something went wrong — please try again.');
      btn.disabled = false;
      btn.textContent = 'Join the List';
      return;
    }

    myId    = data.id;
    myOrder = data.queue_order;

    document.getElementById('state-join').style.display   = 'none';
    document.getElementById('state-status').style.display = 'block';
    document.getElementById('customer-tag').textContent    = `Queued as ${name}`;

    await renderStatus();
    subscribeRealtime();
  }

  function showError(msg) {
    const el = document.getElementById('err-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // ── Confirm arrival ("I'm Here") ──────────────────────────────────────────────
  async function confirmArrival() {
    document.getElementById('confirm-btn').disabled = true;
    clearInterval(countdownInterval);
    await db.from('daily_queue').update({ confirmed: true }).eq('id', myId);
    document.getElementById('confirm-section').style.display = 'none';
    document.getElementById('banner-msg').textContent = "Confirmed — Please step inside.";
  }

  // ── Render live status ────────────────────────────────────────────────────────
  async function renderStatus() {
    const { data: self } = await db
      .from('daily_queue')
      .select('status, confirmed, activated_at')
      .eq('id', myId)
      .single();

    if (!self) return;

    if (self.status === 'noshow') {
      showNoshowState();
      return;
    }

    const isActive = self.status === 'active';

    const { count } = await db
      .from('daily_queue')
      .select('id', { count: 'exact', head: true })
      .eq('status', 'waiting')
      .lte('queue_order', myOrder);

    const position = isActive ? 0 : (count ?? 1);

    updateBanner(position, isActive, self);
    updateStats(position, isActive);
    maybeFireWebhooks(position, isActive);

    // Feature 3: start confirmation countdown if active and not yet confirmed
    if (isActive && !self.confirmed && self.activated_at) {
      startCountdown(self.activated_at);
    }
  }

  // ── No-show state ─────────────────────────────────────────────────────────────
  function showNoshowState() {
    clearInterval(countdownInterval);
    const banner = document.getElementById('banner');
    banner.className = 'banner grey';
    document.getElementById('banner-msg').textContent = "Your spot was given away — please rejoin if you still need a cut.";
    document.getElementById('confirm-section').style.display = 'none';
    document.getElementById('stat-pos').textContent  = '—';
    document.getElementById('stat-wait').textContent = '—';
  }

  // ── Confirmation countdown ────────────────────────────────────────────────────
  function startCountdown(activatedAt) {
    // Avoid duplicate intervals
    if (countdownInterval) return;

    const confirmSection = document.getElementById('confirm-section');
    const countdownText  = document.getElementById('countdown-text');
    confirmSection.style.display = 'block';

    function tick() {
      const elapsed  = (Date.now() - new Date(activatedAt).getTime()) / 1000;
      const remaining = Math.max(0, CONFIRM_SECONDS - elapsed);
      const mins = Math.floor(remaining / 60);
      const secs = Math.floor(remaining % 60);
      countdownText.textContent = `Confirm within ${mins}:${String(secs).padStart(2,'0')} or lose your spot`;

      if (remaining <= 0) {
        clearInterval(countdownInterval);
        // Auto no-show: customer didn't confirm in time
        db.from('daily_queue').update({ status: 'noshow' }).eq('id', myId);
      }
    }

    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  // ── Update banner ─────────────────────────────────────────────────────────────
  function updateBanner(position, isActive, self) {
    const banner = document.getElementById('banner');
    const msg    = document.getElementById('banner-msg');

    if (isActive && self.confirmed) {
      banner.className = 'banner red';
      msg.textContent  = "Confirmed — Please step inside.";
      document.getElementById('confirm-section').style.display = 'none';
    } else if (isActive) {
      banner.className = 'banner red';
      msg.textContent  = "You're Up — Please step inside.";
    } else if (position <= 3) {
      banner.className = 'banner amber';
      msg.textContent  = 'Head This Way — Start traveling to the shop.';
    } else {
      banner.className = 'banner green';
      msg.textContent  = 'Relax — You have time.';
    }
  }

  // ── Update stat cards ─────────────────────────────────────────────────────────
  function updateStats(position, isActive) {
    const posEl      = document.getElementById('stat-pos');
    const waitEl     = document.getElementById('stat-wait');
    const waitUnitEl = document.getElementById('stat-wait-unit');

    if (isActive) {
      posEl.textContent      = '●';
      waitEl.textContent     = '0';
      waitUnitEl.textContent = 'min';
      return;
    }

    posEl.textContent = position;

    if (position <= 1) {
      waitEl.textContent     = '0';
      waitUnitEl.textContent = 'min';
    } else {
      const lo = (position - 1) * 20;
      const hi = lo + 15;
      waitEl.textContent     = `${lo}–${hi}`;
      waitUnitEl.textContent = 'min';
    }
  }

  // ── Webhook triggers (once per session per event) ─────────────────────────────
  async function maybeFireWebhooks(position, isActive) {
    if (isActive && !webhookSent.status_active) {
      webhookSent.status_active = true;
      const { data: c } = await db.from('daily_queue').select('*').eq('id', myId).single();
      triggerWebhook('status_active', c);
    }
    if (position === 3 && !webhookSent.position_3rd) {
      webhookSent.position_3rd = true;
      const { data: c } = await db.from('daily_queue').select('*').eq('id', myId).single();
      triggerWebhook('position_3rd', c);
    }
  }

  // ── Supabase Realtime ─────────────────────────────────────────────────────────
  function subscribeRealtime() {
    db.channel('customer-queue')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_queue' }, () => {
        renderStatus();
      })
      .subscribe();
  }
</script>
</body>
</html>
